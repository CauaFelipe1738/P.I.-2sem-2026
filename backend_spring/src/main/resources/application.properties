spring.application.name=backend_spring

# Banco de dados configurável via variáveis de ambiente (fallback H2 PostgreSQL mode para dev local)
spring.datasource.url=${DB_URL:jdbc:h2:mem:edulytics_dev;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Observabilidade
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Segurança JWT & CORS
app.jwt.secret=${JWT_SECRET:edulytics-dev-jwt-secret-key-minimum-32-characters-long}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:28800}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
