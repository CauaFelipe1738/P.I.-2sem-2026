services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-monitoramento_academico}
      POSTGRES_USER: ${DB_USERNAME:-edulytics}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-edulytics_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-edulytics} -d ${DB_NAME:-monitoramento_academico}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend_spring
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-monitoramento_academico}
      DB_DRIVER: org.postgresql.Driver
      DB_USERNAME: ${DB_USERNAME:-edulytics}
      DB_PASSWORD: ${DB_PASSWORD:-edulytics_local_dev}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JWT_SECRET: ${JWT_SECRET:-edulytics-dev-jwt-secret-key-with-at-least-32-chars}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_API_MODE: ${VITE_API_MODE:-http}
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
