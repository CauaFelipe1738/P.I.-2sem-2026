<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <div>
        <h1>Login</h1>
        <from>
            <label for="username">Nome de Usuário:</label>

            <label for="password">Senha:</label>

             <button type="submit">Entrar</button>

        </from>
    </div>

</body>
